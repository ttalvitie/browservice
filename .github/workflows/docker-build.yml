name: Build and Push Docker Image

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest Browservice release
        id: release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/ttalvitie/browservice/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mac
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/startergo/browservice:latest-arm64
            ghcr.io/startergo/browservice:${{ steps.release.outputs.version }}-arm64

  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest Browservice release
        id: release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/ttalvitie/browservice/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.intel
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/startergo/browservice:latest-amd64
            ghcr.io/startergo/browservice:${{ steps.release.outputs.version }}-amd64

  merge-manifest:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-amd64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest Browservice release
        id: release
        run: |
          LATEST=$(curl -s https://api.github.com/repos/ttalvitie/browservice/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/startergo/browservice:latest \
            --tag ghcr.io/startergo/browservice:${{ steps.release.outputs.version }} \
            ghcr.io/startergo/browservice:latest-arm64 \
            ghcr.io/startergo/browservice:latest-amd64
